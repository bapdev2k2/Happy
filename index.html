<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Cố lênnnn!!!</title>
    <link rel="Shortcut Icon" href="./em.png" type="image/x-icon" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      html, body { 
        height: 100%; 
        width: 100%;
        overflow: hidden; /* Chặn scroll trang chính */
      }
      body {
        font-family: "Helvetica Neue", "Luxi Sans", "DejaVu Sans", Tahoma, "Hiragino Sans GB", "Microsoft Yahei", sans-serif;
        background: #79a8ae; 
        color: #CFEBE4; 
        font-size: 16px; 
        line-height: 1.5; 
        margin: 0; 
        padding: 0;
      }
      
      /* Responsive Font Size */
      @media (min-width: 768px) {
        body { font-size: 18px; line-height: 1.8; }
      }

      a { color: #ebf7f4; }
      .body--ready {
        background: linear-gradient(180deg, rgb(245,222,238) 0%, rgb(235,89,210) 120%);
      }

      /* Logo Styling */
      .cs { width: 100%; position: absolute; top: 0; left: 0; text-align: center; z-index: 5; pointer-events: none; }
      img#logo {
        width: 80px; /* Mobile nhỏ hơn chút */
        height: 80px;
        background-size: cover; 
        border-radius: 50%; 
        box-shadow: 0px 0px 20px rgba(63,81,181,.72);
        border: 2px solid #00a0ff; 
        opacity: 1; 
        margin: 10px auto; 
        transition: all 1.0s;
        object-fit: cover;
      }
      
      @media (min-width: 768px) {
        img#logo {
          width: 120px; height: 120px;
          margin: 20px auto;
          box-shadow: 0px 0px 40px rgba(63,81,181,.72);
          border: 3px solid #00a0ff;
        }
      }
      #logo:hover {
        box-shadow: 0 0 10px #fff; transform: rotate(360deg);
      }

      /* Text Counter Styling */
      .text { 
        position: fixed; 
        bottom: 20px; /* Thấp xuống chút cho thoáng */
        left: 0;
        text-align: center; 
        width: 100%; 
        font-weight: bold;
        font-size: 14px;
        padding: 0 15px;
        z-index: 10;
        text-shadow: 0 2px 4px rgba(0,0,0,0.3);
      }
      
      @media (min-width: 768px) {
        .text { bottom: 30px; font-size: 18px; }
      }

      /* ====== LOGIN OVERLAY ====== */
      #login-overlay {
        position: fixed; inset: 0; z-index: 9999;
        background: radial-gradient(circle at 30% 20%, #ffe6f4, #ffc1e7, #f59cd8);
        display: flex; align-items: center; justify-content: center; padding: 10px;
      }
      .login-card {
        width: 100%; 
        max-width: 450px; 
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        color: #222; 
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0,0,0,.2); 
        padding: 20px;
        margin: 0 auto;
        display: flex; flex-direction: column; gap: 10px;
      }
      
      .login-title {
        text-align: center; font-weight: 800; font-size: 1.2rem; margin: 0 0 10px; color: #d63384;
      }
      .login-content { 
        display: flex; flex-direction: column; align-items: center; gap: 15px;
      }
      /* Layout ngang cho tablet/desktop */
      @media (min-width: 640px) {
        .login-content { flex-direction: row; align-items: flex-start; }
        .login-card { padding: 30px; max-width: 550px; }
      }

      .login-avatar {
        width: 100px; height: 100px; border-radius: 15px; object-fit: cover; border: 2px solid #ffe0f1;
        box-shadow: 0 6px 18px rgba(255,105,180,.25);
      }
      
      .pin-wrap { width: 100%; display: flex; flex-direction: column; gap: 10px; }
      
      .pin-input {
        width: 100%;
        height: 44px; border-radius: 12px; border: 2px solid #f0f0f0; outline: none; padding: 0 12px;
        font-size: 20px; text-align: center; letter-spacing: .3em; background: #fafafa;
        color: #333;
      }
      .pin-input:focus { border-color: #ff80bf; background: #fff; }

      .keypad {
        display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%;
      }
      .keypad button {
        height: 42px; 
        border: 0; border-radius: 10px; background: #fff; 
        box-shadow: 0 2px 5px rgba(0,0,0,.1);
        font-weight: 600; font-size: 16px; cursor: pointer; 
        transition: transform .05s, background .2s;
        color: #444;
      }
      .keypad button:active { transform: scale(.95); background: #eee; }
      .keypad .ok { background: #18c964; color: #fff; box-shadow: 0 4px 10px rgba(24,201,100,0.3); }
      .keypad .clear { background: #ff4d6d; color: #fff; box-shadow: 0 4px 10px rgba(255,77,109,0.3); }
      .keypad .back { background: #edf2f7; color: #333; }

      .hint { font-size: 13px; color: #666; text-align: center; margin-top: 5px; min-height: 20px; }
      .error { color: #e02424; font-weight: bold; }
      .hidden { display: none !important; }
      
      /* Animation Shake */
      @keyframes shake {
        10%, 90% { transform: translateX(-2px); }
        20%, 80% { transform: translateX(4px); }
        30%, 50%, 70% { transform: translateX(-8px); }
        40%, 60% { transform: translateX(8px); }
      }
      .shake { animation: shake .35s linear; }

      /* Canvas Positioning */
      canvas { position: absolute; top: 0; left: 0; display: block; }
      #rainCanvas { z-index: 0; }
      .canvas { z-index: 1; } /* Particle canvas */
      
      .main-content { display: none; opacity: 0; transition: opacity 1s; width: 100%; height: 100%; position: relative;}
      .main-content.active { display: block; opacity: 1; }

      /* Button "Quà nè" responsive */
      #universe-link {
        font-size: 14px; padding: 8px 16px; bottom: 80px; /* Mobile cao hơn chút để tránh thanh home */
      }
      @media (min-width: 768px) {
        #universe-link { font-size: 16px; padding: 12px 24px; bottom: 100px; }
      }
    </style>
  </head>

<div id="vutru-overlay" style="display:none; position:fixed; inset:0; z-index:9998; background:#0b0015;">

  <body>
    <div id="login-overlay">
      <div class="login-card" id="login-card">
        <h2 class="login-title">NHẬP PASS ĐI NGƯỜI ĐẸP</h2>

      <div id="galaxy-container" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; z-index:1;"></div>
      
      <a id="universe-link" href="#" style="display:none; position:fixed; left:50%; transform:translateX(-50%); z-index:20; background:#ff4d6d; color:white; border:none; border-radius:50px; cursor:pointer; font-weight:bold; box-shadow:0 4px 15px rgba(255, 77, 109, 0.5); text-decoration:none; transition: transform 0.2s;">

    <script>
      /* ===== Rain background Responsive ===== */
      const canvas = document.getElementById('rainCanvas');
      const ctx = canvas.getContext('2d');
      let columns, drops;
      
      function resizeCanvas(){ 
        canvas.width = window.innerWidth; 
        canvas.height = window.innerHeight; 
        const fontSize = 14; // Smaller font for mobile
        columns = Math.floor(canvas.width/fontSize);
        drops = Array(columns).fill(1);
        ctx.font = fontSize + 'px arial';
      }
      
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas(); // Init immediately

      const letters='LET GO'.split(''); 
      
      function drawRainBackground(){
        ctx.fillStyle='rgba(0,0,0,0.05)'; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle='#f584b7'; 
        // Re-set font in loop is safer if resize happened
        ctx.font = '14px arial';
        
        for(let i=0;i<drops.length;i++){
          const text=letters[Math.floor(Math.random()*letters.length)];
          ctx.fillText(text,i*14,drops[i]*14);
          if(drops[i]*14 > canvas.height || Math.random()>0.95) drops[i]=0; 
          drops[i]++;
        }
      }
      
      /* ===== Counter ===== */
      function show_date_time() {
        window.setTimeout("show_date_time()", 1000);
        BirthDay = new Date("03/06/2024 08:30:00");
        today = new Date();
        timeold = (today.getTime() - BirthDay.getTime());
        sectimeold = timeold / 1000;
        secondsold = Math.floor(sectimeold);
        msPerDay = 24 * 60 * 60 * 1000;
        e_daysold = timeold / msPerDay;
        daysold = Math.floor(e_daysold);
        e_hrsold = (e_daysold - daysold) * 24;
        hrsold = Math.floor(e_hrsold);
        e_minsold = (e_hrsold - hrsold) * 60;
        minsold = Math.floor((e_hrsold - hrsold) * 60);
        seconds = Math.floor((e_minsold - minsold) * 60);
        
        // Break line logic for mobile visibility
        const isMobile = window.innerWidth < 600;
        const separator = isMobile ? "<br>" : " ";
        span_dt_dt.innerHTML = `<span style="color:#fff; font-weight:800">${daysold}</span> Ngày ${separator}<span style="color:#fff; font-weight:800">${hrsold}</span> Giờ <span style="color:#fff; font-weight:800">${minsold}</span> Phút <span style="color:#fff; font-weight:800">${seconds}</span> Giây `;
      }

      /* ===== DOTS ANIMATION RESPONSIVE ===== */
      var S = {
        init: function () {
          S.Drawing.init('.canvas');
          document.body.classList.add('body--ready');
          // Shorten messages for mobile if needed
          S.UI.simulate("Chúc cậu|học thật tốt|giữ vững tin|🎓|#countdown 3|bước thật chắc|vượt kỳ thi|đúng ý|đúng trường|❤️");
          S.Drawing.loop(function () { S.Shape.render(); });
        }
      };
      
      S.Drawing=(function(){
        var canvas,context,renderFn,
        requestFrame=window.requestAnimationFrame||window.webkitRequestAnimationFrame||window.mozRequestAnimationFrame||window.oRequestAnimationFrame||window.msRequestAnimationFrame||function(cb){window.setTimeout(cb,1000/60);};
        
        return {
          init:function(el){
            canvas=document.querySelector(el);
            context=canvas.getContext('2d');
            this.adjustCanvas();
            window.addEventListener('resize',function(){S.Drawing.adjustCanvas();});
          },
          loop:function(fn){
            renderFn=!renderFn?fn:renderFn;
            this.clearFrame();
            renderFn();
            requestFrame.call(window,this.loop.bind(this));
          },
          adjustCanvas:function(){
            // FULL SCREEN RESPONSIVE FIX
            canvas.width=window.innerWidth;
            canvas.height=window.innerHeight;
          },
          clearFrame:function(){context.clearRect(0,0,canvas.width,canvas.height);},
          getArea:function(){return{w:canvas.width,h:canvas.height};},
          drawCircle:function(p,c){
            context.fillStyle=c.render();
            context.beginPath();
            context.arc(p.x,p.y,p.z,0,2*Math.PI,true);
            context.closePath();
            context.fill();
          }
        };
      }());

      S.UI=(function(){
        var interval,currentAction,time,maxShapeSize=30,sequence=[],cmd='#';
        function formatTime(date){var h=date.getHours(),m=date.getMinutes();m=m<10?'0'+m:m;return h+':'+m;}
        function getValue(value){return value&&value.split(' ')[1];}
        function getAction(value){value=value&&value.split(' ')[0];return value&&value[0]===cmd&&value.substring(1);}
        function timedAction(fn,delay,max,reverse){
          clearInterval(interval);currentAction=reverse?max:1;fn(currentAction);
          if(!max||(!reverse&&currentAction<max)||(reverse&&currentAction>0)){
            interval=setInterval(function(){
              currentAction=reverse?currentAction-1:currentAction+1;fn(currentAction);
              if((!reverse&&max&&currentAction===max)||(reverse&&currentAction===0)){clearInterval(interval);}
            },delay);
          }
        }
        function performAction(value){
          var action,value,current;
          sequence=typeof(value)==='object'?value:sequence.concat(value.split('|'));
          timedAction(function(index){
            current=sequence.shift();
            action=getAction(current);
            value=getValue(current);
            switch(action){
              case'countdown':
                value=parseInt(value)||10;value=value>0?value:10;
                timedAction(function(index){
                  if(index===0){
                    if(sequence.length===0){S.Shape.switchShape(S.ShapeBuilder.letter(''));}
                    else{performAction(sequence);}
                  }else{S.Shape.switchShape(S.ShapeBuilder.letter(index),true);}
                },1000,value,true);
                break;
              case'rectangle':
                value=value&&value.split('x');value=(value&&value.length===2)?value:[maxShapeSize,maxShapeSize/2];
                S.Shape.switchShape(S.ShapeBuilder.rectangle(Math.min(maxShapeSize,parseInt(value[0])),Math.min(maxShapeSize,parseInt(value[1]))));
                break;
              case'circle':
                value=parseInt(value)||maxShapeSize;value=Math.min(value,maxShapeSize);
                S.Shape.switchShape(S.ShapeBuilder.circle(value));
                break;
              case'time':
                var t=formatTime(new Date());
                if(sequence.length>0){S.Shape.switchShape(S.ShapeBuilder.letter(t));}
                else{timedAction(function(){t=formatTime(new Date());if(t!==time){time=t;S.Shape.switchShape(S.ShapeBuilder.letter(time));}},1000);}
                break;
              default:
                S.Shape.switchShape(S.ShapeBuilder.letter(current[0]===cmd?'HacPai':current));
                if(current === '❤️') {
                  const uLink = document.getElementById('universe-link');
                  uLink.style.display = 'block';
                  // Animation pop
                  uLink.style.transform = 'translate(-50%) scale(0)';
                  setTimeout(() => uLink.style.transform = 'translate(-50%) scale(1.1)', 50);
                  setTimeout(() => uLink.style.transform = 'translate(-50%) scale(1)', 200);
                }
            }
          },2000,sequence.length);
        }
        return{simulate:function(action){performAction(action);}};
      }());

      S.Point=function(args){this.x=args.x;this.y=args.y;this.z=args.z;this.a=args.a;this.h=args.h;};
      S.Color=function(r,g,b,a){this.r=r;this.g=g;this.b=b;this.a=a;};
      S.Color.prototype={render:function(){return'rgba('+this.r+','+ +this.g+','+this.b+','+this.a+')';}};
      S.Dot=function(x,y){this.p=new S.Point({x:x,y:y,z:5,a:1,h:0});this.e=.07;this.s=true;this.c=new S.Color(255,255,255,this.p.a);this.t=this.clone();this.q=[];};
      S.Dot.prototype={
        clone:function(){return new S.Point({x:this.x,y:this.y,z:this.z,a:this.a,h:this.h});},
        _draw:function(){this.c.a=this.p.a;S.Drawing.drawCircle(this.p,this.c);},
        _moveTowards:function(n){
          var details=this.distanceTo(n,true),dx=details[0],dy=details[1],d=details[2],e=this.e*d;
          if(this.p.h===-1){this.p.x=n.x;this.p.y=n.y;return true;}
          if(d>1){this.p.x-=((dx/d)*e);this.p.y-=((dy/d)*e);}
          else{if(this.p.h>0){this.p.h--;}else{return true;}}return false;
        },
        _update:function(){
          if(this._moveTowards(this.t)){
            var p=this.q.shift();
            if(p){this.t.x=p.x||this.p.x;this.t.y=p.y||this.p.y;this.t.z=p.z||this.p.z;this.t.a=p.a||this.p.a;this.p.h=p.h||0;}
            else{if(this.s){this.p.x-=Math.sin(Math.random()*3.142);this.p.y-=Math.sin(Math.random()*3.142);}
            else{this.move(new S.Point({x:this.p.x+(Math.random()*50)-25,y:this.p.y+(Math.random()*50)-25}));}}
          }
          d=this.p.a-this.t.a;this.p.a=Math.max(.1,this.p.a-(d*.05));
          d=this.p.z-this.t.z;this.p.z=Math.max(1,this.p.z-(d*.05));
        },
        distanceTo:function(n,details){var dx=this.p.x-n.x,dy=this.p.y-n.y,d=Math.sqrt(dx*dx+dy*dy);return details?[dx,dy,d]:d;},
        move:function(p,avoidStatic){if(!avoidStatic||(avoidStatic&&this.distanceTo(p)>1)){this.q.push(p);}},
        render:function(){this._update();this._draw();}
      };

      S.ShapeBuilder=(function(){
        var gap=11, // Smaller gap for better resolution on small screens
            shapeCanvas=document.createElement('canvas'),
            shapeContext=shapeCanvas.getContext('2d'),
            fontSize=500,
            fontFamily='Avenir, Helvetica Neue, Helvetica, Arial, sans-serif';
        
        function fit(){
          shapeCanvas.width=Math.floor(window.innerWidth/gap)*gap;
          shapeCanvas.height=Math.floor(window.innerHeight/gap)*gap;
          shapeContext.fillStyle='red';
          shapeContext.textBaseline='middle';
          shapeContext.textAlign='center';
        }
        function processCanvas(){
          var pixels=shapeContext.getImageData(0,0,shapeCanvas.width,shapeCanvas.height).data;
          dots=[],pixels,x=0,y=0,fx=shapeCanvas.width,fy=shapeCanvas.height,w=0,h=0;
          for(var p=0;p<pixels.length;p+=(4*gap)){
            if(pixels[p+3]>0){
              dots.push(new S.Point({x:x,y:y}));
              w=x>w?x:w;h=y>h?y:h;fx=x<fx?x:fx;fy=y<fy?y:fy;
            }
            x+=gap;
            if(x>=shapeCanvas.width){x=0;y+=gap;p+=gap*4*shapeCanvas.width;}
          }
          return{dots:dots,w:w+fx,h:h+fy};
        }
        function setFontSize(s){shapeContext.font='bold '+s+'px '+fontFamily;}
        function isNumber(n){return!isNaN(parseFloat(n))&&isFinite(n);}
        
        init(); window.addEventListener('resize',fit);
        function init(){fit();}
        
        return{
          imageFile:function(url,callback){
            var image=new Image(),a=S.Drawing.getArea();
            image.onload=function(){
              shapeContext.clearRect(0,0,shapeCanvas.width,shapeCanvas.height);
              // Resize logic for image
              var scale = Math.min((a.w * 0.8) / this.width, (a.h * 0.6) / this.height);
              var dw = this.width * scale;
              var dh = this.height * scale;
              shapeContext.drawImage(this,(shapeCanvas.width-dw)/2,(shapeCanvas.height-dh)/2, dw, dh);
              callback(processCanvas());
            };
            image.onerror=function(){callback(S.ShapeBuilder.letter('What?'));};
            image.src=url;
          },
          circle:function(d){
            var r=Math.max(0,d)/2;shapeContext.clearRect(0,0,shapeCanvas.width,shapeCanvas.height);
            shapeContext.beginPath();shapeContext.arc(r*gap,r*gap,r*gap,0,2*Math.PI,false);shapeContext.fill();shapeContext.closePath();return processCanvas();
          },
          letter:function(l){
            var s=0;setFontSize(fontSize);
            // Responsive text sizing logic
            var metrics = shapeContext.measureText(l);
            var maxW = shapeCanvas.width * 0.9; // Use 90% of screen width
            var maxH = shapeCanvas.height * 0.6;
            
            s=Math.min(fontSize, (maxW/metrics.width)*fontSize, (maxH/fontSize)*(isNumber(l)?1:0.45)*fontSize);
            
            setFontSize(s);
            shapeContext.clearRect(0,0,shapeCanvas.width,shapeCanvas.height);
            shapeContext.fillText(l,shapeCanvas.width/2,shapeCanvas.height/2);
            return processCanvas();
          },
          rectangle:function(w,h){
            var dots=[],width=gap*w,height=gap*h;
            for(var y=0;y<height;y+=gap){for(var x=0;x<width;x+=gap){dots.push(new S.Point({x:x,y:y}));}}
            return{dots:dots,w:width,h:height};
          }
        };
      }());

      S.Shape=(function(){
        var dots=[],width=0,height=0,cx=0,cy=0;
        function compensate(){var a=S.Drawing.getArea();cx=a.w/2-width/2;cy=a.h/2-height/2;}
        return{
          shuffleIdle:function(){var a=S.Drawing.getArea();for(var d=0;d<dots.length;d++){if(!dots[d].s){dots[d].move({x:Math.random()*a.w,y:Math.random()*a.h});}}},
          switchShape:function(n,fast){
            var size,a=S.Drawing.getArea();width=n.w;height=n.h;compensate();
            if(n.dots.length>dots.length){
              size=n.dots.length-dots.length;
              for(var d=1;d<=size;d++){dots.push(new S.Dot(a.w/2,a.h/2));}
            }
            var d=0,i=0;
            while(n.dots.length>0){
              i=Math.floor(Math.random()*n.dots.length);
              dots[d].e=fast?.25:(dots[d].s?.14:.11);
              if(dots[d].s){dots[d].move(new S.Point({z:Math.random()*20+10,a:Math.random(),h:18}));}
              else{dots[d].move(new S.Point({z:Math.random()*5+5,h:fast?18:30}));}
              dots[d].s=true;
              dots[d].move(new S.Point({x:n.dots[i].x+cx,y:n.dots[i].y+cy,a:1,z:5,h:0}));
              n.dots=n.dots.slice(0,i).concat(n.dots.slice(i+1));
              d++;
            }
            for(var i=d;i<dots.length;i++){
              if(dots[i].s){
                dots[i].move(new S.Point({z:Math.random()*20+10,a:Math.random(),h:20}));
                dots[i].s=false;dots[i].e=.04;
                dots[i].move(new S.Point({x:Math.random()*a.w,y:Math.random()*a.h,a:.3,z:Math.random()*4,h:0}));
              }
            }
          },
          render:function(){for(var d=0;d<dots.length;d++){dots[d].render();}}
        };
      }());

      /* ===== LOGIN SCRIPT ===== */
      (function () {
        const PASS = "13072008";
        const overlay = document.getElementById('login-overlay');
        const card = document.getElementById('login-card');
        const pin = document.getElementById('pin');
        const keypad = document.getElementById('keypad');
        const okBtn = document.getElementById('okBtn');
        const backBtn = document.getElementById('backBtn');
        const clearBtn = document.getElementById('clearBtn');
        const hint = document.getElementById('loginHint');
        const audio = document.getElementById('bgmusic');
        const mainContent = document.getElementById('main-content');
        let audioUnlocked = false;

        function setMsg(msg, isErr=false){
          hint.innerHTML = msg || "Pass là ngày sinh nhật cậu á (ddmmyyyy)"; 
          hint.classList.toggle('error', !!isErr);
        }

        // Fade-in audio
        function fadeInAudio(targetVol = 0.6, step = 0.05, everyMs = 120) {
          try { audio.muted = false; audio.volume = 0; } catch(e) {}
          const iv = setInterval(() => {
            try {
              if (audio.volume + step >= targetVol) {
                audio.volume = targetVol;
                clearInterval(iv);
              } else {
                audio.volume = Math.min(1, audio.volume + step);
              }
            } catch(e) { clearInterval(iv); }
          }, everyMs);
        }

        async function tryPlayAudio() {
          if (!audio) return;
          try {
            audio.muted = false;
            await audio.play();
            fadeInAudio();
            audioUnlocked = true;
          } catch (e) {
            audioUnlocked = false;
          }
        }

        function attachOneTimeUnlock() {
          const once = async () => {
            if (!audioUnlocked) await tryPlayAudio();
          };
          window.addEventListener('pointerdown', once, { once: true });
          window.addEventListener('keydown', once, { once: true });
        }

        function startMainContent() {
          mainContent.classList.add('active');
          setInterval(drawRainBackground, 50);
          show_date_time();
          S.init();

          tryPlayAudio();
          attachOneTimeUnlock();

          setTimeout(() => {
            const galaxyContainer = document.getElementById('galaxy-container');
            if(galaxyContainer) galaxyContainer.style.display = 'block';
          }, 1000);
        }

        function check(){
          if (pin.value === PASS) {
            overlay.classList.add('hidden');
            startMainContent();
          } else {
            setMsg('Sai pass rồi 😜', true);
            card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
            pin.value = '';
          }
        }

        keypad.addEventListener('click', (e)=>{
          // Xử lý click button và cả icon bên trong button (nếu có)
          const btn = e.target.closest('button');
          if (!btn) return;
          
          const k = btn.getAttribute('data-key');
          if (k) { 
            if (pin.value.length < 8) pin.value += k; 
            setMsg(''); 
          }
        });
        
        okBtn.addEventListener('click', check);
        backBtn.addEventListener('click', ()=>{ pin.value = pin.value.slice(0,-1); setMsg(''); });
        clearBtn.addEventListener('click', ()=>{ pin.value=''; setMsg(''); });
        
        window.addEventListener('keydown', (e)=>{
          if (/^\d$/.test(e.key)) { if (pin.value.length < 8) pin.value += e.key; setMsg(''); }
          if (e.key === 'Backspace') { pin.value = pin.value.slice(0,-1); }
          if (e.key === 'Enter') { check(); }
        });
      })();

      const universeLink = document.getElementById('universe-link');
      const vutruOverlay = document.getElementById('vutru-overlay');
      const vutruFrame   = document.getElementById('vutru-frame');
      const vutruBackBtn = document.getElementById('vutru-back');

      if (universeLink && vutruOverlay && vutruFrame) {
        universeLink.addEventListener('click', (e) => {
          e.preventDefault(); 
          vutruOverlay.style.display = 'block';
          if (!vutruFrame.src || /about:blank/.test(vutruFrame.src)) {
            vutruFrame.src = 'vutru.html';
          }
        });
      }

      if (vutruBackBtn) {
        vutruBackBtn.addEventListener('click', () => {
          try { vutruFrame.src = 'about:blank'; } catch(e){}
          vutruOverlay.style.display = 'none';
        });
      }

      // Xử lý nút Back trình duyệt trên Mobile
      window.addEventListener('popstate', () => {
        if (vutruOverlay.style.display === 'block') {
          try { vutruFrame.src = 'about:blank'; } catch(e){}
          vutruOverlay.style.display = 'none';
        }
      });
    </script>
  </body>
</html>
